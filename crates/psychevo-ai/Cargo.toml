[package]
name = "psychevo-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Provider-neutral Rust SDK for language, image, speech, transcription, and realtime AI"
documentation = "https://docs.rs/psychevo-ai"
keywords = ["ai", "agent", "llm"]
categories = ["api-bindings", "development-tools"]

[package.metadata.psychevo]
architecture-layer = 0

[features]
default = []
openai = ["dep:image"]
anthropic = []
xiaomi = []

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
image = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiktoken.workspace = true
