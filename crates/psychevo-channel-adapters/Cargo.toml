[package]
name = "psychevo-channel-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.psychevo]
architecture-layer = 3

[features]
default = []
telegram = []
wechat = ["dep:qrcode"]
feishu-lark = ["dep:feishu-sdk"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
feishu-sdk = { workspace = true, optional = true }
futures.workspace = true
psychevo-extension-protocol = { path = "../psychevo-extension-protocol" }
qrcode = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
