[package]
name = "psychevo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "In-process Framework for building coding agents with Psychevo"
documentation = "https://docs.rs/psychevo"
keywords = ["ai", "agent", "coding", "llm"]
categories = ["development-tools"]
autotests = false

[package.metadata.psychevo]
architecture-layer = 2

[features]
default = []
native-keyring = ["dep:keyring"]

[dependencies]
base64.workspace = true
chardetng.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
encoding_rs2.workspace = true
flate2.workspace = true
futures.workspace = true
html2text.workspace = true
http.workspace = true
image.workspace = true
libc.workspace = true
portable-pty.workspace = true
psychevo-agent-core = { version = "0.1.0", path = "../psychevo-agent-core" }
psychevo-ai = { version = "0.1.0", path = "../psychevo-ai", default-features = false, features = ["openai", "anthropic", "xiaomi"] }
quick_html2md.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
similar.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tar.workspace = true
thiserror.workspace = true
tiktoken.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"], optional = true }
landlock.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"], optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"], optional = true }
windows-sys.workspace = true

[[test]]
name = "public_framework"
path = "tests/public_framework.rs"

[[test]]
name = "host_process"
path = "tests/host_process.rs"

[[test]]
name = "live_providers"
path = "tests/live_providers.rs"
