[package]
name = "psychevo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "In-process Framework for building coding agents with Psychevo"
documentation = "https://docs.rs/psychevo"
keywords = ["ai", "agent", "coding", "llm"]
categories = ["development-tools"]
autotests = false

[features]
default = []
# Private bridge used by Psychevo's first-party product crates while the
# published default surface remains the Framework API.
product = []

[dependencies]
base64.workspace = true
chardetng.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
encoding_rs2.workspace = true
futures.workspace = true
html2text.workspace = true
http.workspace = true
image.workspace = true
keyring.workspace = true
libc.workspace = true
portable-pty.workspace = true
psychevo-agent-core = { version = "0.1.0", path = "../psychevo-agent-core" }
psychevo-ai = { version = "0.1.0", path = "../psychevo-ai" }
quick_html2md.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
similar.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tiktoken.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
uuid.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rusqlite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[[test]]
name = "public_framework"
path = "tests/public_framework.rs"

[[test]]
name = "product_api"
path = "tests/product_api.rs"
required-features = ["product"]

[[test]]
name = "host_process"
path = "tests/host_process.rs"
required-features = ["product"]

[[test]]
name = "live_providers"
path = "tests/live_providers.rs"
required-features = ["product"]
