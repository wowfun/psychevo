[package]
name = "psychevo-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "psychevo-app-server"
path = "src/bin/psychevo-app-server.rs"

[features]
default = ["native-channels"]
native-channels = ["dep:feishu-sdk", "dep:qrcode"]

[dependencies]
axum.workspace = true
agent-client-protocol.workspace = true
agent-client-protocol-schema.workspace = true
base64.workspace = true
chrono.workspace = true
feishu-sdk = { workspace = true, optional = true }
futures.workspace = true
getrandom.workspace = true
http.workspace = true
percent-encoding.workspace = true
portable-pty.workspace = true
psychevo-gateway-protocol = { path = "../psychevo-gateway-protocol" }
psychevo = { path = "../psychevo", features = ["internal"] }
qrcode = { workspace = true, optional = true }
reqwest.workspace = true
regex-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tungstenite = "0.28"
