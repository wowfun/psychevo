name: High-risk instrumentation

on:
  schedule:
    - cron: "0 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: Coverage, deterministic contracts, Miri, and AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read repository instrumentation pins
        id: tools
        shell: python
        run: |
          import os
          from pathlib import Path
          import tomllib

          config = tomllib.loads(Path("instrumentation-tools.toml").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"nightly={config['nightly']}\n")
              output.write(f"cargo_llvm_cov={config['cargo-llvm-cov']['version']}\n")

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Install pinned nightly instrumentation components
        run: >-
          rustup toolchain install "${{ steps.tools.outputs.nightly }}"
          --profile minimal
          --component miri
          --component rust-src
          --component llvm-tools-preview

      - name: Install pinned Cargo instrumentation tools
        run: >-
          cargo install --locked cargo-llvm-cov
          --version "${{ steps.tools.outputs.cargo_llvm_cov }}"

      - name: Run bounded high-risk instrumentation
        run: >-
          cargo xtask ci run
          --profile instrumentation
          --artifact-root .local/instrumentation

      - name: Retain structured instrumentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psychevo-high-risk-instrumentation
          include-hidden-files: true
          if-no-files-found: error
          path: .local/instrumentation
