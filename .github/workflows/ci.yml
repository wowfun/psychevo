name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    outputs:
      common: ${{ steps.changes.outputs.common }}
      rust: ${{ steps.changes.outputs.rust }}
      sdk: ${{ steps.changes.outputs.sdk }}
      desktop: ${{ steps.changes.outputs.desktop }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Classify pull request changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            common:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'xtask/**'
            rust:
              - 'crates/**'
              - 'scripts/**'
              - 'assets/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/protocol/**'
            sdk:
              - '.github/workflows/package.yml'
              - 'crates/psychevo/**'
              - 'crates/psychevo-ai/**'
              - 'crates/psychevo-agent-core/**'
              - 'crates/psychevo-gateway-protocol/**'
              - 'crates/psychevo-gateway/src/app_server.rs'
              - 'crates/psychevo-gateway/src/bin/app_server.rs'
              - 'packages/client/**'
              - 'packages/protocol/**'
              - 'python/**'
            desktop:
              - 'apps/desktop/src-tauri/**'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'assets/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'playwright.config.ts'
              - 'tsconfig.base.json'

  rust_checks:
    name: Rust checks
    needs: scope
    if: >-
      ${{
        always() &&
        needs.scope.result == 'success' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.draft == false ||
          needs.scope.outputs.common == 'true' ||
          needs.scope.outputs.rust == 'true'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust checks
        run: cargo xtask ci run --profile rust-checks

  rust_tests:
    name: Rust tests
    needs: scope
    if: >-
      ${{
        always() &&
        needs.scope.result == 'success' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.draft == false ||
          needs.scope.outputs.common == 'true' ||
          needs.scope.outputs.rust == 'true'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Run Rust tests
        run: cargo xtask ci run --profile rust-tests

  sdk_contracts:
    name: SDK contracts
    needs: scope
    if: >-
      ${{
        always() &&
        needs.scope.result == 'success' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.draft == false ||
          needs.scope.outputs.common == 'true' ||
          needs.scope.outputs.sdk == 'true'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.22

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK contracts
        run: cargo xtask ci run --profile sdk-contracts

  main_artifact_smoke:
    name: Main artifact smoke
    needs: scope
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.scope.result == 'success'
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.22

      - name: Build, install, and exercise SDK and App Server artifacts
        run: >-
          cargo xtask ci run --profile main-artifact-smoke
          --artifact-root .local/main-artifact-smoke

      - name: Retain tested SDK and App Server artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psychevo-main-sdk-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/main-artifact-smoke/plan.json
            .local/main-artifact-smoke/results.json
            .local/main-artifact-smoke/logs
            .local/main-artifact-smoke/package/python

  desktop_rust:
    name: Desktop Rust
    needs: scope
    if: >-
      ${{
        always() &&
        needs.scope.result == 'success' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.draft == false ||
          needs.scope.outputs.common == 'true' ||
          needs.scope.outputs.desktop == 'true'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Desktop Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev

      - name: Run Desktop Rust gate
        run: cargo xtask ci run --profile desktop-rust

  web:
    name: Web
    needs: scope
    if: >-
      ${{
        always() &&
        needs.scope.result == 'success' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.draft == false ||
          needs.scope.outputs.common == 'true' ||
          needs.scope.outputs.web == 'true'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Web gate
        run: cargo xtask ci run --profile web

  ci_gate:
    name: CI Gate
    needs: [scope, rust_checks, rust_tests, sdk_contracts, main_artifact_smoke, desktop_rust, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify selected jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          COMMON_SELECTED: ${{ needs.scope.outputs.common }}
          RUST_SELECTED: ${{ needs.scope.outputs.rust }}
          SDK_SELECTED: ${{ needs.scope.outputs.sdk }}
          DESKTOP_SELECTED: ${{ needs.scope.outputs.desktop }}
          WEB_SELECTED: ${{ needs.scope.outputs.web }}
          READY: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
          RUST_CHECKS_RESULT: ${{ needs.rust_checks.result }}
          RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          SDK_CONTRACTS_RESULT: ${{ needs.sdk_contracts.result }}
          MAIN_ARTIFACT_SMOKE_RESULT: ${{ needs.main_artifact_smoke.result }}
          DESKTOP_RESULT: ${{ needs.desktop_rust.result }}
          WEB_RESULT: ${{ needs.web.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          expect_job() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=Unexpected CI job result::$name was $actual; expected $expected"
              return 1
            fi
          }

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "::error title=Scope failed::Scope finished with $SCOPE_RESULT"
            exit 1
          fi

          rust_expected=skipped
          sdk_expected=skipped
          main_artifact_expected=skipped
          desktop_expected=skipped
          web_expected=skipped
          if [[ "$READY" == "true" || "$COMMON_SELECTED" == "true" || "$RUST_SELECTED" == "true" ]]; then
            rust_expected=success
          fi
          if [[ "$READY" == "true" || "$COMMON_SELECTED" == "true" || "$SDK_SELECTED" == "true" ]]; then
            sdk_expected=success
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            main_artifact_expected=success
          fi
          if [[ "$READY" == "true" || "$COMMON_SELECTED" == "true" || "$DESKTOP_SELECTED" == "true" ]]; then
            desktop_expected=success
          fi
          if [[ "$READY" == "true" || "$COMMON_SELECTED" == "true" || "$WEB_SELECTED" == "true" ]]; then
            web_expected=success
          fi

          expect_job "Rust checks" "$RUST_CHECKS_RESULT" "$rust_expected"
          expect_job "Rust tests" "$RUST_TESTS_RESULT" "$rust_expected"
          expect_job "SDK contracts" "$SDK_CONTRACTS_RESULT" "$sdk_expected"
          expect_job "Main artifact smoke" "$MAIN_ARTIFACT_SMOKE_RESULT" "$main_artifact_expected"
          expect_job "Desktop Rust" "$DESKTOP_RESULT" "$desktop_expected"
          expect_job "Web" "$WEB_RESULT" "$web_expected"
