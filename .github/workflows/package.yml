name: Package

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned supply-chain scanners
        run: |
          python scripts/supply_chain_tools.py install --bin-dir "${RUNNER_TEMP}/psychevo-supply-chain"
          echo "${RUNNER_TEMP}/psychevo-supply-chain" >> "${GITHUB_PATH}"

      - name: Run supply-chain policy
        run: cargo xtask ci run --profile supply-chain

  host-artifacts:
    name: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PSYCHEVO_CI_ARTIFACT_ROOT: .local/package-matrix/${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.22

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux Desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf xauth xvfb

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and smoke host artifacts
        run: cargo xtask ci run --profile package --package --artifact-root "${{ env.PSYCHEVO_CI_ARTIFACT_ROOT }}"

      - name: Attest package provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: .local/package-matrix/${{ matrix.os }}/package/checksums.sha256

      - name: Retain reviewable host artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psychevo-${{ runner.os }}-${{ runner.arch }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ steps.provenance.outputs.bundle-path }}
            .local/package-matrix/${{ matrix.os }}/plan.json
            .local/package-matrix/${{ matrix.os }}/results.json
            .local/package-matrix/${{ matrix.os }}/logs
            .local/package-matrix/${{ matrix.os }}/package/checksums.sha256
            .local/package-matrix/${{ matrix.os }}/package/native-artifact-smoke.json
            .local/package-matrix/${{ matrix.os }}/package/native-artifact-smoke
            .local/package-matrix/${{ matrix.os }}/package/python
            .local/package-matrix/${{ matrix.os }}/package/cli-target/release/pevo
            .local/package-matrix/${{ matrix.os }}/package/cli-target/release/pevo.exe
            .local/package-matrix/${{ matrix.os }}/package/desktop-target/release/psychevo-desktop
            .local/package-matrix/${{ matrix.os }}/package/desktop-target/release/psychevo-desktop.exe
            .local/package-matrix/${{ matrix.os }}/package/desktop-target/release/bundle
