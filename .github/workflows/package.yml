name: Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-artifacts:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-15","windows-2025"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    env:
      PSYCHEVO_CI_ARTIFACT_ROOT: .local/package-matrix/${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0 action revision
        with:
          toolchain: 1.97.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.22

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fa1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux Desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and smoke host artifacts
        run: cargo xtask ci run --profile package --package --artifact-root "${{ env.PSYCHEVO_CI_ARTIFACT_ROOT }}"

      - name: Retain reviewable host artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psychevo-${{ runner.os }}-${{ runner.arch }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/package-matrix/${{ matrix.os }}/plan.json
            .local/package-matrix/${{ matrix.os }}/results.json
            .local/package-matrix/${{ matrix.os }}/logs
            .local/package-matrix/${{ matrix.os }}/package/checksums.sha256
            .local/package-matrix/${{ matrix.os }}/package/python
            .local/package-matrix/${{ matrix.os }}/package/cli-target/release/pevo*
            .local/package-matrix/${{ matrix.os }}/package/desktop-target/release/bundle
