name: Extended deterministic validation

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    name: Visual, surface, and non-functional acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action revision

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.22

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deterministic visual prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg golang-go ttyd xvfb libappindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf
          install -d "${RUNNER_TEMP}/vhs-bin"
          GOBIN="${RUNNER_TEMP}/vhs-bin" go install github.com/charmbracelet/vhs@v0.11.0
          echo "${RUNNER_TEMP}/vhs-bin" >> "${GITHUB_PATH}"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full deterministic visual inventory
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1440x960x24"
          cargo xtask ci run --profile visual
          --artifact-root .local/extended/visual

      - name: Run cross-surface profile
        if: ${{ !cancelled() }}
        run: >-
          cargo xtask ci run --profile surface-profile
          --artifact-root .local/extended/surface-profile

      - name: Run non-functional budgets
        if: ${{ !cancelled() }}
        run: >-
          cargo xtask ci run --profile non-functional
          --artifact-root .local/extended/non-functional

      - name: Retain extended validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psychevo-extended-validation
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/extended
            !.local/extended/**/framework-check-*
            !.local/extended/**/cli-target
            !.local/extended/**/non-functional-desktop-target
            !.local/extended/**/package-target
