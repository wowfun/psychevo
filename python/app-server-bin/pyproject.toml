[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "psychevo-app-server-bin"
version = "0.1.0"
description = "Platform App Server binary for the Psychevo Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/wowfun/psychevo"
Documentation = "https://github.com/wowfun/psychevo/blob/main/docs/sdk.md"
Repository = "https://github.com/wowfun/psychevo"

[tool.psychevo-build]
kind = "app-server"
