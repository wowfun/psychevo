[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "psychevo"
version = "0.1.0"
description = "Async Python SDK for Psychevo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psychevo-app-server-bin==0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["psychevo-cli-bin==0.1.0"]

[project.urls]
Homepage = "https://github.com/wowfun/psychevo"
Documentation = "https://github.com/wowfun/psychevo/blob/main/docs/sdk.md"
Repository = "https://github.com/wowfun/psychevo"

[tool.psychevo-build]
kind = "pure"
package = "psychevo"
package-root = "src"
