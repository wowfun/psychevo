[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "psychevo"
version = "0.1.0"
description = "Async Python SDK for Psychevo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "psychevo-app-server-bin==0.1.0",
    "websockets>=15,<16",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["psychevo-cli-bin==0.1.0"]

[project.urls]
Homepage = "https://github.com/wowfun/psychevo"
Documentation = "https://github.com/wowfun/psychevo/blob/main/docs/sdk.md"
Repository = "https://github.com/wowfun/psychevo"

[tool.psychevo-build]
kind = "pure"
package = "psychevo"
package-root = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/psychevo"]

[tool.hatch.build.targets.sdist]
include = [
    "src/psychevo",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
